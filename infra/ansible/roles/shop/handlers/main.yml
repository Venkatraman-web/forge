---
- name: Restart forgecart
  ansible.builtin.systemd_service:
    name: forgecart
    state: restarted

- name: Restart forgecart-payments
  ansible.builtin.systemd_service:
    name: forgecart-payments
    state: restarted

- name: Restart forgecart-dispatcher
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: restarted
  loop:
    - forgecart-dispatcher
    - forgecart-dispatcher2
    - forgecart-dispatcher3
    - forgecart-dispatcher4
