# Ansible settings for the Forge test machines. Run from this folder, with the ansible-core in ~/.forge-aws/venv:
#   ~/.forge-aws/venv/bin/ansible-playbook playbooks/audit.yml
[defaults]
inventory = inventory/hosts.ini
roles_path = roles
remote_user = ubuntu
private_key_file = ~/.ssh/forge-key.pem
host_key_checking = True
retry_files_enabled = False
stdout_callback = default
result_format = yaml
timeout = 60

[ssh_connection]
ssh_args = -o StrictHostKeyChecking=accept-new -o ControlMaster=no -o ServerAliveInterval=15 -o ServerAliveCountMax=4
pipelining = True
retries = 3
