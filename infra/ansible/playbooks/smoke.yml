---
# A few requests that prove the deployed system answers as designed (read-only; nothing is created).
#   ansible-playbook playbooks/smoke.yml
- name: Requests to the shop
  hosts: shop
  gather_facts: false
  tasks:
    - name: The product list answers and is not empty
      ansible.builtin.uri:
        url: http://127.0.0.1:8090/v1/products?limit=1
        return_content: true
      register: products
      failed_when: products.status != 200 or (products.json.products | length) == 0

    - name: A path with no route answers 404 in the JSON error shape
      ansible.builtin.uri:
        url: http://127.0.0.1:8090/v1/nothing
        status_code: 404
        return_content: true
      register: unrouted
      failed_when: unrouted.status != 404 or unrouted.json.error.code != 'not_found'

- name: Requests to Forge
  hosts: forge
  gather_facts: false
  tasks:
    - name: The health check answers, without a key
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/health
        status_code: 200

    - name: The submit API refuses a request without a key
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/v1/jobs
        status_code: 401
